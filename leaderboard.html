<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>House Leaderboard</title>
  <link rel="stylesheet" href="style.css"> <!-- Use your existing CSS -->
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 60vh;
      margin-top: 40px;
    }

    .podium .house {
      margin: 0 20px;
      padding: 10px;
      border-radius: 10px;
      background: #fff;
      width: 150px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .first { height: 250px; background-color: gold; }
    .second { height: 200px; background-color: silver; }
    .third { height: 150px; background-color: #cd7f32; }

    .house img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .score {
      font-size: 24px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🏆 House Leaderboard</h1>
  <div class="podium" id="podium"></div>

  <script>
    fetch('https://teacher-backend-4d3v.onrender.com/api/houses')
      .then(res => res.json())
      .then(data => {
        const podium = document.getElementById('podium');
        data.forEach((house, index) => {
          const div = document.createElement('div');
          div.className = `house ${['first', 'second', 'third'][index] || ''}`;
          div.innerHTML = `
            <img src="${house.image}" alt="${house.name}">
            <h3>${house.name}</h3>
            <div class="score">${house.score} pts</div>
          `;
          podium.appendChild(div);
        });
      });
	</script>
	
</body>
</html>
