<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitions</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 30px;
        }

        #back-button {
            display: block;
            width: fit-content;
            margin: 20px auto 0;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        #back-button:hover {
            background-color: #1e7e34;
        }

        #competitions-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
            gap: 20px;
            padding: 0 20px;
        }

        .competition {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 300px;
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .competition:hover {
            transform: scale(1.05);
        }

        .competition h2 {
            font-size: 1.6em;
            margin-bottom: 10px;
            color: #1f3c5d;
        }

        .competition p {
            color: #555;
            margin-bottom: 10px;
        }

        .competition p strong {
            color: #1f3c5d;
        }

        .competition a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .competition a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Competitions</h1>
    <a href="index.html" id="back-button">← Back to Home</a>
    <div id="competitions-container">
        <!-- Competitions will load here -->
    </div>

    <script>
        // Fetch competitions from the backend API
        fetch('http://localhost:5000/api/competitions')
            .then(response => response.json())
            .then(data => {
                const competitionsContainer = document.getElementById('competitions-container');
                data.forEach(competition => {
                    const competitionElement = document.createElement('div');
                    competitionElement.classList.add('competition');
                    competitionElement.innerHTML = `
                        <h2>${competition.eventName}</h2>
                        <p><strong>Class Group:</strong> ${competition.classGroup}</p>
                        <p><strong>Day/Date:</strong> ${competition.dayDate}</p>
                        <p><strong>Venue:</strong> ${competition.venue}</p>
                        <p><strong>Description:</strong> ${competition.shortDescription}</p>
                        <a href="${competition.registrationLink}" target="_blank">Register Here</a>
                    `;
                    competitionsContainer.appendChild(competitionElement);
                });
            })
            .catch(error => {
                console.error('Error fetching competitions:', error);
            });
    </script>
</body>
</html>
