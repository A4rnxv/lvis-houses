<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher Dashboard | LVIS Competitions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: white;
      padding: 10px 0;
      text-align: center;
    }

    button {
      padding: 10px;
      margin: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .content {
      padding: 20px;
    }

    .competition-card {
      background-color: #fff;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .competition-card h4 {
      margin: 0;
      font-size: 20px;
    }

    .competition-card p {
      margin: 5px 0;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: white;
      padding: 20px;
      width: 300px;
      border-radius: 5px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }
  </style>
</head>
<body>
<header>
  <div>Teacher Dashboard</div>
  <button onclick="openModal()">Create New Competition</button>
</header>

<div class="content">
  <h2>Published Competitions</h2>
  <div id="competitionList"></div>
</div>

<!-- Modal -->
<div id="competitionModal" class="modal">
  <div class="modal-content">
    <h3>Create/Edit Competition</h3>
    <form id="competitionForm">
      <input type="hidden" id="editingId">
      <label>Event Name</label>
      <input type="text" id="eventName" required>
      <label>Class Group</label>
      <input type="text" id="classGroup" required>
      <label>Date</label>
      <input type="date" id="eventDate" required>
      <label>Venue</label>
      <input type="text" id="venue" required>
      <label>Description</label>
      <textarea id="description" required></textarea>
      <label>Registration Link</label>
      <input type="url" id="registrationLink" required>
      <div class="form-actions">
        <button type="button" onclick="publishCompetition()">Publish</button>
        <button type="button" onclick="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
  function openModal() {
    document.getElementById("competitionModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("competitionModal").style.display = "none";
    document.getElementById("competitionForm").reset();
    document.getElementById("editingId").value = "";
  }

  function fetchCompetitions() {
    fetch('http://localhost:5000/api/competitions')
      .then(res => {
        if (!res.ok) throw new Error('Failed to fetch competitions');
        return res.json();
      })
      .then(data => {
        const list = document.getElementById("competitionList");
        list.innerHTML = "";

        if (data.length === 0) {
          list.innerHTML = "<p>No competitions available</p>";
        } else {
          data.forEach(comp => {
            const compId = comp._id?.$oid || comp._id;

            const div = document.createElement("div");
            div.classList.add("competition-card");
            div.dataset.id = compId;

            div.innerHTML = `
              <h4>${comp.eventName}</h4>
              <p><strong>Class:</strong> ${comp.classGroup}</p>
              <p><strong>Date:</strong> ${comp.dayDate}</p>
              <p><strong>Venue:</strong> ${comp.venue}</p>
              <p><strong>Description:</strong> ${comp.shortDescription}</p>
              <p><strong>Registration:</strong> <a href="${comp.registrationLink}" target="_blank">${comp.registrationLink}</a></p>
              <button class="delete-button" onclick="deleteCompetition('${compId}')">Delete</button>
              <button class="edit-button" onclick="editCompetition('${compId}')">Edit</button>
            `;
            list.appendChild(div);
          });
        }
      })
      .catch(err => {
        console.error('Error fetching competitions:', err);
        alert('Could not load competitions');
      });
  }

  function deleteCompetition(id) {
    console.log(`Deleting competition with ID: ${id}`);

    if (!id || id.length !== 24) {
      alert('Invalid MongoDB ID: ' + id);
      return;
    }

    fetch(`http://localhost:5000/api/competitions/${id}`, {
      method: 'DELETE',
    })
    .then(res => {
      if (!res.ok) throw new Error('Failed to delete');
      return res.json();
    })
    .then(() => fetchCompetitions())
    .catch(err => alert(err.message));
  }

  function editCompetition(id) {
    console.log(`Editing competition with ID: ${id}`);

    const card = document.querySelector(`[data-id="${id}"]`);
    if (!card) return;

    const getText = (selector) => card.querySelector(selector).innerText.split(': ')[1];

    document.getElementById("eventName").value = card.querySelector("h4").innerText;
    document.getElementById("classGroup").value = getText("p:nth-of-type(1)");
    document.getElementById("eventDate").value = getText("p:nth-of-type(2)");
    document.getElementById("venue").value = getText("p:nth-of-type(3)");
    document.getElementById("description").value = getText("p:nth-of-type(4)");
    document.getElementById("registrationLink").value = card.querySelector("a").href;
    document.getElementById("editingId").value = id;

    openModal();
  }

  function publishCompetition() {
    const editingId = document.getElementById("editingId").value;
    const payload = {
      eventName: document.getElementById("eventName").value,
      classGroup: document.getElementById("classGroup").value,
      dayDate: document.getElementById("eventDate").value,
      venue: document.getElementById("venue").value,
      shortDescription: document.getElementById("description").value,
      registrationLink: document.getElementById("registrationLink").value,
    };

    const url = editingId
      ? `http://localhost:5000/api/competitions/${editingId}`
      : 'http://localhost:5000/api/competitions';

    const method = editingId ? 'PUT' : 'POST';

    fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(res => {
      if (!res.ok) throw new Error('Failed to publish competition');
      return res.json();
    })
    .then(() => {
      console.log("Competition published successfully!");
      fetchCompetitions();
      closeModal();
    })
    .catch(err => {
      console.error('Error:', err);
      alert(err.message);
    });
  }

  window.onload = fetchCompetitions;
</script>
</body>
</html>
